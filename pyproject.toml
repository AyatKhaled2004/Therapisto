[project]
name = "therapisto"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AyatKhaled2004", email = "ayatkhaled32721@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.11.20",
    "fastapi>=0.165.0",
    "google-genai>=3.6.1",
    "langchain-core>=1.8.4",
    "langchain-google-genai",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
    "tavily-python>=0.8.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
therapisto = "therapisto:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9",
    "python-dotenv>=1,<2",
    "pydantic-settings>=2,<3",
    "langgraph>=0.3,<2",
    "langchain-google-genai",
    "pinecone>=6,<9",
    "tavily-python>=0.5,<1",
    "pymupdf>=1.24,<2",
    "certifi>=2024",
    "httpx>=0.27,<1",
    "langgraph-checkpoint-sqlite==3.1.2",
]
